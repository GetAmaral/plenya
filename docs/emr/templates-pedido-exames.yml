justificativas:
  - codigo: PLN1CF5711F
    nome: 'TC coração para escore de cálcio coronariano'
    texto: |
      Indicação: Tomografia computadorizada para quantificação do escore de cálcio coronariano (método de Agatston).

      A estratificação de risco cardiovascular baseada apenas em fatores clínicos e calculadoras populacionais classifica grande parcela dos pacientes na faixa de risco intermediário, onde a decisão de iniciar ou adiar terapia preventiva permanece incerta. O escore de cálcio coronariano mede diretamente a carga de aterosclerose calcificada subclínica e é o exame de imagem mais validado para refinar essa estratificação.

      O estudo MESA (Multi-Ethnic Study of Atherosclerosis) demonstrou que a adição do escore de cálcio às calculadoras tradicionais melhora de forma significativa a reclassificação do risco, reposicionando corretamente pacientes que viriam a ter eventos para a faixa de risco mais alto e, igualmente importante, pacientes sem doença subclínica para a faixa de risco mais baixo. Um escore zero identifica indivíduos com taxa de eventos cardiovasculares muito baixa ao longo de dez anos (o chamado poder do zero), o que embasa adiar ou suspender terapias farmacológicas com segurança e evita tratamento desnecessário. Em contrapartida, escores elevados (acima de 100, e sobretudo acima de 300 ou no percentil 75 para idade e sexo) reposicionam o paciente em risco alto e justificam intensificação da prevenção.

      As diretrizes vigentes sustentam esse uso: a diretriz multissocietária de manejo da dislipidemia atribui ao escore de cálcio recomendação de classe I para auxiliar a decisão de terapia preventiva em adultos de risco intermediário, e as diretrizes brasileiras da Sociedade Brasileira de Cardiologia o reconhecem como fator reclassificador de risco nas faixas intermediária e limítrofe. O exame é não invasivo, de baixa dose de radiação, dispensa contraste e tem alto valor prognóstico independente dos fatores de risco tradicionais.

      Pelo exposto, a quantificação do escore de cálcio coronariano é solicitada como ferramenta de refinamento da estratificação de risco e de individualização da conduta preventiva.

      Referências:
      1. Detrano R, et al. Coronary calcium as a predictor of coronary events in four racial or ethnic groups (MESA). N Engl J Med. 2008;358(13):1336-1345.
      2. Polonsky TS, et al. Coronary artery calcium score and risk classification for coronary heart disease prediction (MESA). JAMA. 2010;303(16):1610-1616.
      3. Grundy SM, et al. 2018 AHA/ACC/Multisociety Guideline on the Management of Blood Cholesterol. Circulation. 2019;139(25):e1082-e1143.
      4. Orringer CE, et al. The National Lipid Association scientific statement on coronary artery calcium scoring to guide preventive strategies for ASCVD risk reduction. J Clin Lipidol. 2021;15(1):33-60.
      5. Blaha MJ, et al. Coronary Artery Calcium Scoring: Is It Time for a Change in Methodology? JACC Cardiovasc Imaging. 2017;10(8):923-937.
      6. Sociedade Brasileira de Cardiologia. Atualização da Diretriz de Prevenção Cardiovascular da SBC. Arq Bras Cardiol. 2019;113(4):787-891.
  - codigo: PLN607D3327
    nome: 'TC tórax'
    texto: |
      Indicação: Tomografia computadorizada de tórax.

      Em avaliação ampla orientada à longevidade, a TC de tórax permite a detecção precoce de doença torácica clinicamente silenciosa, com dois achados de relevância prognóstica documentada:

      1. Câncer de pulmão em fase inicial. O câncer de pulmão em pessoas que nunca fumaram representa hoje 10% a 25% dos casos e figura entre as principais causas de morte por câncer no mundo; por não se enquadrarem no perfil clássico de risco, esses casos costumam ser detectados tardiamente. Poluição do ar, radônio, exposição passada à fumaça, suscetibilidade genética e o envelhecimento sustentam a investigação por imagem independentemente do histórico tabágico.

      2. Anormalidades intersticiais pulmonares (ILA). Achado incidental em 2% a 7% dos não fumantes, associa-se de forma independente a maior mortalidade geral (razão de risco ajustada em torno de 3,9 em coortes), a maior incidência de câncer de pulmão e a progressão para fibrose, informação que altera o seguimento e a estratificação de risco.

      Referências: Lung cancer in never smokers: from early detection to prevention. Trends in Cancer 2025 · CT screening amid rising threat of lung cancer in never-smokers. Radiology 2025 · Prevalence, risk factors and outcomes of adult interstitial lung abnormalities: systematic review and meta-analysis. Am J Respir Crit Care Med 2024 · Interstitial lung abnormalities at CT: subtypes and clinical significance. RadioGraphics 2023.
