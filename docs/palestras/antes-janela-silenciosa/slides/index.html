const main = document.getElementById("main");
const stats = document.getElementById("stats");
let currentIndex = -1;

function render(filter = "all") {
  main.innerHTML = "";
  const byBlock = {};
  SLIDES.forEach(s => {
    if (filter !== "all" && String(s.b) !== String(filter)) return;
    (byBlock[s.b] = byBlock[s.b] || []).push(s);
  });
  Object.keys(byBlock).sort((a, b) => a - b).forEach(bk => {
    const block = document.createElement("section");
    block.className = "block";
    const header = document.createElement("div");
    header.className = "block-header";
    header.innerHTML = `<div class="block-title">${BLOCKS[bk].title}</div><div class="block-meta">${BLOCKS[bk].duration} · ${byBlock[bk].length} slides</div>`;
    block.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "grid";
    byBlock[bk].forEach(s => {
      const card = document.createElement("div");
      card.className = "slide-card";
      const idx = SLIDES.indexOf(s);
      card.onclick = () => openOverlay(idx);
      card.innerHTML = `
        <div class="thumb">
          <img src="${s.file}" alt="${s.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="missing" style="display:none;">
            <div>aguardando geração</div>
            <div style="font-size: 10px; opacity: 0.6;">${s.file}</div>
          </div>
        </div>
        <div class="card-footer">
          <div class="card-num">#${String(Math.floor(s.n)).padStart(2, "0")}${s.n % 1 ? "b" : ""} · ${s.time}</div>
          <div class="card-title">${s.title}</div>
        </div>`;
      grid.appendChild(card);
    });
    block.appendChild(grid);
    main.appendChild(block);
  });
  updateStats();
}

function updateStats() {
  // Detect missing by probing all images once page is rendered
  let loaded = 0, missing = 0;
  const imgs = main.querySelectorAll(".thumb img");
  const total = SLIDES.length;
  imgs.forEach(img => {
    if (img.complete && img.naturalHeight > 0) loaded++;
    else if (img.style.display === "none") missing++;
  });
  // Heuristic — this runs too early; rely on onerror/onload to increment later
  stats.textContent = `${SLIDES.length} slides no total · clique para abrir em tela cheia · setas ← → para navegar`;
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.filter);
  });
});

// Overlay
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlay-img");
const overlayNum = document.getElementById("overlay-num");
const overlayTitle = document.getElementById("overlay-title");

function openOverlay(idx) {
  currentIndex = idx;
  const s = SLIDES[idx];
  overlayImg.src = s.file;
  overlayNum.textContent = `#${String(Math.floor(s.n)).padStart(2, "0")}${s.n % 1 ? "b" : ""} · ${BLOCKS[s.b].title} · ${s.time}`;
  overlayTitle.textContent = s.title;
  overlay.classList.add("active");
}

function closeOverlay() {
  overlay.classList.remove("active");
  currentIndex = -1;
}

function navigate(delta) {
  if (currentIndex < 0) return;
  const next = currentIndex + delta;
  if (next >= 0 && next < SLIDES.length) openOverlay(next);
}

document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("active")) return;
  if (e.key === "Escape") closeOverlay();
  else if (e.key === "ArrowLeft") navigate(-1);
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); navigate(1); }
});

overlay.addEventListener("click", e => {
  if (e.target === overlay) closeOverlay();
});

render();
</script>
</body>
</html>
