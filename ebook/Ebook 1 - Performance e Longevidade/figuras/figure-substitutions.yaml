    - pt: "Trajetória completa de Paulo ao longo de 24 meses. Os Capítulos 8 (sobre o pilar inicial) e 11 (sobre rigor) marcaram melhoras em homens marcadores no início. Aos 18 meses, no entanto, os marcadores começaram a regredir silenciosamente — sem mudança no tratamento, sem alteração visível, sem causa aparente que se explicasse. T+24m: confirmação diagnóstica de apneia obstrutiva do sono (PSG: IAH 32, CPAP titulado, plus protocolo circadiano (sono em janela de 23h–06h, exposição matinal à luz, jejum noturno de 12h). O CPAP é protocolo de sistema, e a regressão silenciosa não regulou — superaram a peso. O caso de Paulo é, portanto, prova concentrada da tese deste livro: 4 pilares biológicos só funcionam se o quinto — o ritmo — está incluído na conta."
      en: "Paulo's full 24-month trajectory. Chapters 8 (on the initial pillar) and 11 (on rigor) marked improvements across markers at the start. At 18 months, however, markers began to silently regress — with no change in treatment, no visible change, no apparent cause to explain it. T+24m: diagnostic confirmation of obstructive sleep apnea (PSG: AHI 32, titrated CPAP, plus circadian protocol (sleep window 11pm–6am, morning light exposure, 12h overnight fast). CPAP is a systems protocol, and the silent regression did not regulate — they overcame the weight. Paulo's case is therefore concentrated proof of this book's thesis: the 4 biological pillars only work if the fifth — rhythm — is included in the equation."
