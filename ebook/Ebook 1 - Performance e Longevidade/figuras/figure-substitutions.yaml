# PT-BR -> EN figure text substitutions for "Antes" / "Before"
# Format: each figure has substitutions, notes, keep_unchanged.
# Rule: patient names stay in Portuguese. Universal abbreviations stay.
# PT decimal comma -> EN period. PT thousands period -> EN comma.

# =============================================================================
# Cap01 Fig01.PNG - Tres check-ups 'normais'
# =============================================================================
- figure: "Cap01 Fig01.PNG"
  substitutions:
    - pt: "Três check-ups 'normais' — uma tendência perigosa"
      en: "Three 'normal' check-ups — a dangerous trend"
    - pt: "Limite de normalidade (lab)"
      en: "Lab upper limit of normal"
    - pt: "Pré-diabetes"
      en: "Prediabetes"
    - pt: "Normal — mas subótimo"
      en: "Normal — but suboptimal"
    - pt: "Normal"
      en: "Normal"
    - pt: "Zona ótima para longevidade"
      en: "Optimal zone for longevity"
    - pt: "Cada resultado estava 'normal'."
      en: "Each result was 'normal'."
    - pt: "A tendência não estava."
      en: "The trend was not."
    - pt: "Check-up 1"
      en: "Check-up 1"
    - pt: "(5 anos atrás)"
      en: "(5 years ago)"
    - pt: "Check-up 2"
      en: "Check-up 2"
    - pt: "(2 anos atrás)"
      en: "(2 years ago)"
    - pt: "Check-up 3"
      en: "Check-up 3"
    - pt: "(hoje)"
      en: "(today)"
    - pt: "Check-up 4"
      en: "Check-up 4"
    - pt: "(projeção daqui 2 anos)"
      en: "(projection in 2 years)"
    - pt: "HbA1c (hemoglobina glicada) reflete a média do açúcar no sangue nos últimos 2–3 meses."
      en: "HbA1c (glycated hemoglobin) reflects average blood sugar over the last 2–3 months."
    - pt: "A faixa 'normal' do laboratório (abaixo de 5,7%) inclui valores que, embora não configurem pré-diabetes, já estão longe do ótimo para longevidade. A tendência importa mais que o número isolado."
      en: "The lab's 'normal' range (below 5.7%) includes values that, while not classifying as prediabetes, are already far from optimal for longevity. The trend matters more than any single number."
  notes:
    - "Decimal: '5,7%' -> '5.7%'"
    - "Decimal: '4,9' '5,2' '5,4' on bars -> '4.9' '5.2' '5.4'"
  keep_unchanged:
    - "HbA1c (universal abbreviation)"

