      en: "Fasting insulin"
    - pt: "Homocisteína"
      en: "Homocysteine"
    - pt: "Idade arterial*"
      en: "Arterial age*"
    - pt: "(idade real)"
      en: "(real age)"
    - pt: "Zona ótima"
      en: "Optimal zone"
    - pt: "Abaixo do alvo ótimo para longevidade"
