# Glossário terminológico ANTES
#
# Fonte de verdade dos termos-chave do livro e suas traduções oficiais.
# Todo tradutor deve seguir este glossário para garantir consistência entre versões.
#
# Convenções:
#   - pt-BR é a língua-fonte
#   - Campo "source" = texto original a ser traduzido
#   - Campo "translations" = versões aprovadas por idioma
#   - Campo "keep_original" = true para termos que NUNCA se traduzem (marcas, siglas internacionais, nomes próprios)
#   - Campo "note" = orientação editorial para o tradutor
#
# Uso recomendado: passar este YAML junto com o capítulo para tradutor
# humano ou como system prompt para pipeline de tradução automatizada.

version: 1
source_language: pt-BR
target_languages: [en, es, fr, de]
last_updated: 2026-04-21

# ============================================================
# CONCEITOS CENTRAIS DO LIVRO
# ============================================================

concepts:
  - source: "janela silenciosa"
    translations:
      en: "silent window"
      es: "ventana silenciosa"
      fr: "fenêtre silencieuse"
      de: "stilles Fenster"
    note: "Conceito central do livro. Manter minúscula exceto em início de frase ou título."

  - source: "entre o normal e o ótimo"
    translations:
      en: "between normal and optimal"
      es: "entre lo normal y lo óptimo"
      fr: "entre le normal et l'optimal"
      de: "zwischen normal und optimal"
    note: "Parte do subtítulo. Tradução literal ok — evite perífrases."

  - source: "onde a saúde é decidida"
    translations:
      en: "where health is decided"
      es: "donde se decide la salud"
      fr: "où la santé se décide"
      de: "wo Gesundheit entschieden wird"

  - source: "Começa antes."
    translations:
      en: "It begins before."
      es: "Comienza antes."
      fr: "Cela commence avant."
      de: "Es beginnt vorher."
    note: "Mantra de fechamento. Ponto final obrigatório. Tipografia em negrito ou destaque."

  - source: "painel ampliado de biomarcadores"
    translations:
      en: "expanded biomarker panel"
      es: "panel ampliado de biomarcadores"
      fr: "panel élargi de biomarqueurs"
      de: "erweitertes Biomarker-Panel"

  - source: "placar de longevidade"
    translations:
      en: "longevity scorecard"
      es: "marcador de longevidad"
      fr: "tableau de longévité"
      de: "Langlebigkeitsbewertung"

  - source: "Os Quatro que Matam no Silêncio"
    translations:
      en: "The Four That Kill in Silence"
      es: "Los Cuatro que Matan en Silencio"
      fr: "Les Quatre qui Tuent en Silence"
      de: "Die Vier, die im Stillen töten"
    note: "Título do Cap 2. Capitalização editorial estilo título."

  - source: "check-up ampliado"
    translations:
      en: "expanded check-up"
      es: "chequeo ampliado"
      fr: "check-up élargi"
      de: "erweiterte Vorsorgeuntersuchung"

  - source: "camada visível"
    translations:
      en: "visible layer"
      es: "capa visible"
      fr: "couche visible"
      de: "sichtbare Schicht"
    note: "Cap 8 A2 — se refere à pele, cabelo e unhas como superfície de reflexo sistêmico."

  - source: "janela (na TRH)"
    translations:
      en: "window (in HRT)"
      es: "ventana (en la TRH)"
      fr: "fenêtre (dans le THS)"
      de: "Fenster (in der HRT)"
    note: "Cap 10 — hipótese da janela: período de ~10 anos pós-menopausa em que o estradiol protege. 'Na janela' / 'fora da janela' são frases-chave."

  - source: "eixo cardio-reno-metabólico"
    translations:
      en: "cardio-renal-metabolic axis"
      es: "eje cardio-renal-metabólico"
      fr: "axe cardio-rénal-métabolique"
      de: "kardio-renal-metabolische Achse"
    note: "Cap 9 G1 — conceito que unifica as três classes (SGLT2, finerenona, GLP-1) como proteção transversal."

  - source: "trabalho interno"
    translations:
      en: "inner work"
      es: "trabajo interior"
      fr: "travail intérieur"
      de: "innere Arbeit"
    note: "Cap 12 I1 — título do capítulo: 'O Trabalho Que Só Você Faz'."

  - source: "corpo estendido ao mundo"
    translations:
      en: "the body extended into the world"
      es: "el cuerpo extendido al mundo"
      fr: "le corps étendu au monde"
      de: "der Körper, der sich in die Welt erstreckt"
    note: "Cap 13 I2 — subtítulo: a dimensão relacional e existencial do pilar I."

  - source: "reserva cognitiva"
    translations:
      en: "cognitive reserve"
      es: "reserva cognitiva"
      fr: "réserve cognitive"
      de: "kognitive Reserve"
    note: "Cap 12 — conceito de Yaakov Stern. Capacidade do cérebro de compensar dano através de redes alternativas."

  - source: "declínio cognitivo subjetivo"
    translations:
      en: "subjective cognitive decline (SCD)"
      es: "deterioro cognitivo subjetivo"
      fr: "déclin cognitif subjectif"
      de: "subjektiver kognitiver Abbau"
    note: "Cap 12 — antecedente de MCI. Sigla internacional SCD pode ser mantida em parênteses."

  - source: "comprometimento cognitivo leve"
    translations:
      en: "mild cognitive impairment (MCI)"
      es: "deterioro cognitivo leve (MCI)"
      fr: "trouble cognitif léger (MCI)"
      de: "leichte kognitive Störung (MCI)"
    note: "Cap 12 — sigla MCI é internacional e deve ser introduzida entre parênteses."

  - source: "fronteira da geromedicina"
    translations:
      en: "the geromedicine frontier"
      es: "la frontera de la geromedicina"
      fr: "la frontière de la géromédecine"
      de: "die Grenze der Geromedizin"
    note: "Cap 9 — seção sobre rapamicina, senolíticos, NAD+, urolitina A, espermidina, Akkermansia."

  - source: "terapia endovenosa de longevidade"
    translations:
      en: "IV longevity therapy"
      es: "terapia endovenosa de longevidad"
      fr: "thérapie intraveineuse de longévité"
      de: "intravenöse Longevity-Therapie"
    note: "Cap 9 — também chamado de 'drips'. Anglicismo 'drip' aparece entre aspas no texto pt-BR; manter o uso aproximado em outras línguas."

  - source: "síndrome pós-finasterida"
    translations:
      en: "post-finasteride syndrome (PFS)"
      es: "síndrome post-finasteride (PFS)"
      fr: "syndrome post-finastéride (PFS)"
      de: "Post-Finasterid-Syndrom (PFS)"
    note: "Cap 8 — posicionamento clínico do autor. Sigla PFS deve ser introduzida. Reconhecimento EMA 2025, FDA 2022."

  - source: "alopecia androgenética"
    translations:
      en: "androgenetic alopecia"
      es: "alopecia androgenética"
      fr: "alopécie androgénétique"
      de: "androgenetische Alopezie"

  - source: "vale de erosão silenciosa"
    translations:
      en: "silent valley of erosion"
      es: "valle de erosión silenciosa"
      fr: "vallée d'érosion silencieuse"
      de: "stilles Tal der Erosion"
    note: "Cap 13 — metáfora do autor para a meia-idade como período de deterioração de vínculos sociais."

  - source: "o ritual"
    translations:
      en: "the ritual"
      es: "el ritual"
      fr: "le rituel"
      de: "das Ritual"
    note: "Cap 13 — modo como Ricardo e Marina chamam a caminhada silenciosa de domingo. Minúscula e entre aspas no original."

  - source: "vínculos sociais"
    translations:
      en: "social bonds"
      es: "vínculos sociales"
      fr: "liens sociaux"
      de: "soziale Bindungen"
    note: "Cap 13 — sub-pilar. Preferir 'vínculos sociais' a 'conexão social' (mais forte, mais preciso)."

  - source: "sobrecarga do cuidador"
    translations:
      en: "caregiver strain"
      es: "sobrecarga del cuidador"
      fr: "épuisement de l'aidant"
      de: "Angehörigenbelastung"
    note: "Cap 13 — síndrome do cuidador, com biologia documentada (cortisol, PCR, telômeros)."

  - source: "atenção fragmentada"
    translations:
      en: "fragmented attention"
      es: "atención fragmentada"
      fr: "attention fragmentée"
      de: "fragmentierte Aufmerksamkeit"
    note: "Cap 13 — diagnóstico contemporâneo derivado da pesquisa de Gloria Mark (UC Irvine)."

  - source: "doomscrolling"
    translations:
      en: "doomscrolling"
      es: "doomscrolling"
      fr: "doomscrolling"
      de: "Doomscrolling"
    note: "Cap 13 — anglicismo consolidado. Manter em itálico na primeira ocorrência e adicionar nota curta em rodapé se necessário."

  - source: "bem-estar eudaimônico"
    translations:
      en: "eudaimonic well-being"
      es: "bienestar eudaimónico"
      fr: "bien-être eudémonique"
      de: "eudaimonisches Wohlbefinden"
    note: "Cap 13 — conceito de Andrew Steptoe, distinguindo bem-estar ligado a propósito (eudaimônico) de bem-estar ligado a prazer (hedônico)."

  - source: "ikigai"
    translations:
      all: "ikigai"
    note: "Cap 13 — palavra japonesa. Manter em todas as línguas. Explicar como 'aquilo pelo qual vale levantar de manhã'."

  - source: "plan de vida"
    translations:
      all: "plan de vida"
    note: "Cap 13 — expressão usada na Blue Zone de Nicoya (Costa Rica). Manter em espanhol em todas as línguas."

  - source: "prática contemplativa laica"
    translations:
      en: "secular contemplative practice"
      es: "práctica contemplativa laica"
      fr: "pratique contemplative laïque"
      de: "säkulare kontemplative Praxis"
    note: "Cap 13 — termo que descreve meditação, journaling e silêncio deliberado em paciente sem filiação religiosa."

# ============================================================
# NUNCA TRADUZIR — MARCAS E NOMES PRÓPRIOS
# ============================================================

keep_original:
  - term: "ANTES"
    note: "Título do livro em pt-BR. Em outras línguas será traduzido por equivalente local (BEFORE / ANTES ES / AVANT / VORHER), mas no corpo do texto quando mencionar o título original em pt-BR, manter ANTES."

  - term: "Plenya"
    note: "Marca. Nome da clínica do autor. Nunca traduzir."

  - term: "Método AGIR"
    note: "Marca conceitual do método. Em pt manter AGIR. Em outras línguas tem adaptação oficial — ver seção 'method_names' abaixo."

  - term: "Dr. Getúlio José Mattos do Amaral Filho"
    note: "Nome do autor. Adaptar título médico: Dr./Dra./Doctor/Médecin conforme língua, mas nome próprio imutável."

  - term: "Londrina"
    note: "Cidade. Nunca traduzir."

# ============================================================
# NOME DO MÉTODO POR IDIOMA
# ============================================================

method_names:
  pt-BR:
    name: "AGIR"
    stands_for: "Atividade física, Alimentação e Suplementação inteligente; Gestão clínica e metabólica; Integração mente-corpo; Ritmo circadiano e Repouso"
    imperative_meaning: "Verbo 'agir' (to act)"
  en:
    name: "ACTS"
    stands_for: "Activity, Alimentation & Smart adjuncts; Clinical optimization; Tending mind & body; Sleep & circadian rhythm"
    imperative_meaning: "'Acts' as verb/imperative — preserves 'to act' sense"
  es:
    name: "AGIR"
    note: "Mantém o nome original — funciona como sigla pois 'actuar' em espanhol não forma acrônimo equivalente. Explicar na introdução como método do autor."
  fr:
    name: "AGIR"
    note: "Mantém — 'agir' é o mesmo verbo em francês, com mesmo sentido imperativo. Vantagem linguística."
  de:
    name: "AGIR"
    note: "Mantém como marca. Traduzir o significado dos pilares individualmente."

# ============================================================
# BIOMARCADORES E SIGLAS MÉDICAS INTERNACIONAIS
# ============================================================
# Essas siglas são universais na literatura científica — nunca traduzir

never_translate:
  biomarkers:
    - "HbA1c"          # hemoglobina glicada
    - "PCR-us"         # PCR ultrassensível (high-sensitivity C-reactive protein — em EN usar "hs-CRP")
    - "ApoB"           # apolipoproteína B
    - "Lp(a)"          # lipoproteína (a)
    - "LDL-c"
    - "HDL-c"
    - "TG/HDL"         # razão triglicérides/HDL
    - "TOTG"           # teste oral de tolerância à glicose (em EN usar "OGTT")
    - "CAC score"      # calcium score coronariano
    - "NT-proBNP"
    - "TSH"
    - "T3, T4"
    - "VO2 max"
    - "HRV"            # heart rate variability
    - "SHBG"           # globulina ligadora de hormônios sexuais
    - "DHEA-S"         # dehidroepiandrosterona sulfato
    - "IGF-1"          # fator de crescimento insulina-símile 1
    - "p-tau217"       # biomarcador plasmático de Alzheimer (Cap 12)
    - "PHQ-9"          # Patient Health Questionnaire — triagem de depressão
    - "GAD-7"          # Generalized Anxiety Disorder — triagem de ansiedade
    - "AUDIT"          # Alcohol Use Disorders Identification Test
    - "PCL-5"          # PTSD Checklist for DSM-5
    - "MoCA"           # Montreal Cognitive Assessment
    - "MCI"            # mild cognitive impairment
    - "SCD"            # subjective cognitive decline
    - "PDE5"           # inibidores de fosfodiesterase 5 (sildenafila, tadalafila, vardenafila)
    - "APOE4"          # variante do gene APOE
    - "MTHFR"          # metilenotetrahidrofolato redutase
    - "ACE score"      # Adverse Childhood Experiences score (Cap 12)
    - "MBSR"           # Mindfulness-Based Stress Reduction
    - "TCC"            # terapia cognitivo-comportamental (em EN usar "CBT")
    - "EMDR"           # Eye Movement Desensitization and Reprocessing
    - "IAH"            # índice de apneia-hipopneia (em EN usar "AHI")
    - "CPAP"
    - "TRH"            # terapia de reposição hormonal (em EN usar "HRT")
    - "HSDD"           # transtorno de desejo sexual hipoativo
    - "PFS"            # síndrome pós-finasterida (post-finasteride syndrome)
    - "CID-11"         # Classificação Internacional de Doenças v11 (em EN usar "ICD-11")
    - "FDA"            # agência dos EUA — não traduzir
    - "EMA"            # agência europeia — não traduzir
    - "Anvisa"         # agência brasileira — manter
  exceptions_by_language:
    en:
      - original: "PCR-us"
        translation: "hs-CRP"
        note: "Padrão internacional em inglês"
      - original: "TOTG"
        translation: "OGTT"
        note: "Oral glucose tolerance test — sigla internacional em inglês"
      - original: "TCC"
        translation: "CBT"
        note: "Cognitive Behavioral Therapy"
      - original: "IAH"
        translation: "AHI"
        note: "Apnea-Hypopnea Index"
      - original: "TRH"
        translation: "HRT"
        note: "Hormone Replacement Therapy"
      - original: "CID-11"
        translation: "ICD-11"
        note: "International Classification of Diseases"

  proper_names:
    # Personagens dos casos clínicos — manter nome brasileiro
    - "Ricardo"
    - "Fernanda"
    - "André"
    - "Marcos"
    - "Paulo"
    - "Ana"
    - "Marina"  # esposa de Ricardo (Cap 13 — I2)
    note: "Personagens-âncora. Preservar identidade cultural brasileira. Não anglicizar para Richard, Fernandez, Andrew etc."

# ============================================================
# INSTITUIÇÕES
# ============================================================

institutions:
  - source: "Santa Casa de Londrina"
    translations:
      all: "Santa Casa de Londrina"
    note: "Nome próprio institucional. Manter sempre."

  - source: "Universidade Estadual de Londrina (UEL)"
    translations:
      en: "State University of Londrina (UEL)"
      es: "Universidad Estatal de Londrina (UEL)"
      fr: "Université d'État de Londrina (UEL)"
      de: "Staatliche Universität Londrina (UEL)"
    note: "Manter sigla UEL em todas as línguas."

  - source: "CRM-PR"
    translations:
      all: "CRM-PR"
    note: "Conselho Regional de Medicina do Paraná. Explicar em nota de rodapé na tradução. Nunca traduzir a sigla."

  - source: "Associação Brasileira de Medicina Funcional Integrativa (ABMFI)"
    translations:
      en: "Brazilian Association of Integrative Functional Medicine (ABMFI)"
      es: "Asociación Brasileña de Medicina Funcional Integrativa (ABMFI)"
      fr: "Association Brésilienne de Médecine Fonctionnelle Intégrative (ABMFI)"
      de: "Brasilianische Vereinigung für Funktionelle Integrative Medizin (ABMFI)"

# ============================================================
# ESTILO E TOM
# ============================================================

style_guide:
  tone: "Clínico mas acessível. Autoritativo sem ser arrogante. Caloroso sem ser paternalista. Imperativo curto nas conclusões, explicativo longo nos desenvolvimentos."
  avoid:
    - "Jargão guru-de-bem-estar (wellness, holistic, mindful, healing journey)"
    - "Palavras vagas (things, stuff, essentially, basically)"
    - "Exclamações em texto corrido"
    - "Adjetivos de autopromoção ('renowned', 'leading', 'celebrated')"
  prefer:
    - "Verbos concretos em vez de substantivos abstratos"
    - "Casos clínicos antes de estatísticas"
    - "Números precisos em vez de 'muitos' ou 'vários'"
    - "Primeira pessoa singular quando o autor opina"
  reading_level: "8º ao 10º ano escolar (padrão trade nonfiction internacional)"

# ============================================================
# FIGURAS E LEGENDAS
# ============================================================

figures:
  policy: "Todas as figuras têm texto em pt-BR e devem ser regeradas no idioma de cada tradução."
  storage: "figuras/<lang-code>/Cap<NN>_Fig<MM>.png"
  captions:
    location: "Incluídas no próprio markdown do capítulo, não embutidas na imagem."
    reason: "Caption fora da imagem facilita tradução — só a figura precisa ser regerada, a legenda traduz junto com o texto."
  tools_notes:
    - "Usar mesma fonte (Fraunces para títulos de figura, Inter para corpo)"
    - "Mesma paleta de cores em todos os idiomas (identidade visual consistente)"
    - "Mesmas proporções e dimensões — um livro publicado em 5 idiomas deve parecer o mesmo livro"

# ============================================================
# NUMERAÇÃO E FORMATOS
# ============================================================

formats:
  decimal_separator:
    pt-BR: ","
    en: "."
    es: ","
    fr: ","
    de: ","
  thousands_separator:
    pt-BR: "."
    en: ","
    es: "."
    fr: " " # espaço fino
    de: "."
  example: "12.345,67 (pt/es/de) · 12,345.67 (en) · 12 345,67 (fr)"
  units:
    note: "Sempre SI (kg, cm, mmHg, mg/dL). Não converter para sistema imperial mesmo em EN."
  dates:
    format_recommended: "ISO 8601 (2026-04-19) em contextos técnicos; data por extenso em prosa."
