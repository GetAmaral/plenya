<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 986" width="1480" height="986">
<rect x="1060" y="320" width="350" height="450" fill="none" stroke="#000" stroke-width="2" rx="8" ry="8"/>
<circle cx="543" cy="425" r="215" fill="none" stroke="#888" stroke-width="2"/>
<circle cx="725" cy="544" r="215" fill="none" stroke="#888" stroke-width="2"/>
<circle cx="543" cy="663" r="215" fill="none" stroke="#888" stroke-width="2"/>
<circle cx="361" cy="544" r="215" fill="none" stroke="#888" stroke-width="2"/>
<rect x="475" y="488" width="140" height="137" fill="#fff" rx="10" ry="10"/>
<rect x="475" y="488" width="140" height="137" fill="none" stroke="#000" stroke-width="2.5" rx="10" ry="10"/>
<rect x="40" y="19" width="140" height="33" fill="#000"/>
<text x="110" y="43" font-size="18" font-family="Inter, sans-serif" font-weight="900" letter-spacing="1" fill="#fff" text-anchor="middle">FIGURA 3</text>
<text x="40" y="119" font-size="68" font-family="'Playfair Display', 'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="900" fill="#000" text-anchor="start" textLength="1085" lengthAdjust="spacingAndGlyphs">Ikigai: o que te faz levantar da cama.</text>
<text x="40" y="163" font-size="28" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="950" lengthAdjust="spacingAndGlyphs">Quatro círculos que se cruzam num ponto. O estudo Ohsaki (2008) associou</text>
<text x="40" y="199" font-size="28" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="910" lengthAdjust="spacingAndGlyphs">a resposta afirmativa à pergunta a 30–50% menos mortalidade em 7 anos.</text>
<text x="543" y="272" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">O que</text>
<text x="543" y="307" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">você ama</text>
<text x="852" y="527" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pelo que</text>
<text x="860" y="562" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">pode ser</text>
<text x="850" y="597" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">pago</text>
<text x="543" y="792" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">O que o</text>
<text x="543" y="825" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">mundo</text>
<text x="543" y="857" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">precisa</text>
<text x="245" y="532" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">O que</text>
<text x="245" y="565" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="700" fill="#1a1a1a" text-anchor="middle">faz bem</text>
<text x="427" y="436" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="middle">PAIXÃO</text>
<text x="675" y="436" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="middle">MISSÃO</text>
<text x="428" y="682" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="middle">PROFISSÃO</text>
<text x="678" y="683" font-size="31" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="middle">VOCAÇÃO</text>
<text x="550" y="532" font-size="40" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="bold" fill="#000" text-anchor="middle">IKIGAI</text>
<text x="545" y="572" font-size="25" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="normal" fill="#333" text-anchor="middle" font-style="italic">A razão</text>
<text x="545" y="602" font-size="26" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="normal" fill="#333" text-anchor="middle" font-style="italic">de acordar.</text>
<text x="1080" y="365" font-size="30" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="227" lengthAdjust="spacingAndGlyphs">Pergunta clínica:</text>
<text x="1079" y="436" font-size="40" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="600" fill="#1a1a1a" text-anchor="start" font-style="italic" textLength="309" lengthAdjust="spacingAndGlyphs">“Qual é o motivo que te</text>
<text x="1078" y="475" font-size="35" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="600" fill="#1a1a1a" text-anchor="start" font-style="italic" textLength="315" lengthAdjust="spacingAndGlyphs">faz levantar da cama de</text>
<text x="1077" y="515" font-size="33" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="600" fill="#1a1a1a" text-anchor="start" font-style="italic" textLength="121" lengthAdjust="spacingAndGlyphs">manhã?”</text>
<text x="1078" y="618" font-size="27" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="321" lengthAdjust="spacingAndGlyphs">Se não houver resposta clara</text>
<text x="1078" y="660" font-size="28" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="307" lengthAdjust="spacingAndGlyphs">em um adulto pós-40 anos,</text>
<text x="1079" y="700" font-size="28" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="279" lengthAdjust="spacingAndGlyphs">há uma camada do plano</text>
<text x="1078" y="740" font-size="28" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="197" lengthAdjust="spacingAndGlyphs">que está faltando.</text>
<text x="44" y="906" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#333" text-anchor="start">Fonte:</text>
<text x="115" y="906" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start">conceito japonês tradicional.</text>
<text x="44" y="933" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#333" text-anchor="start">Evidência:</text>
<text x="158" y="933" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start" font-style="italic">Sone et al. (“Sense of Life Worth Living and Mortality in Japan: Ohsaki Study”),</text>
<text x="44" y="963" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start">Psychosomatic Medicine 2008, 70(6):709–715. Coorte de 43.391 adultos, 7 anos de seguimento.</text>
</svg>