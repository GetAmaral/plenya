<text x="110" y="43" font-size="18" font-family="Inter, sans-serif" font-weight="bold" letter-spacing="4" fill="#fff" text-anchor="middle">FIGURA 2</text>
<text x="40" y="110" font-size="54" font-family="'Inter', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="975" lengthAdjust="spacingAndGlyphs">“Os exames estão bons. Eu não estou.”</text>
<text x="40" y="160" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="945" lengthAdjust="spacingAndGlyphs">Ricardo, 18 meses após o infarto: painel biológico em ordem, dimensão relacional em colapso.</text>
<text x="40" y="192" font-size="24" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="690" lengthAdjust="spacingAndGlyphs">O trabalho em conexão, propósito e sentido restaurou os dois lados.</text>
<text x="512" y="235" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#1a1a1a" text-anchor="middle" textLength="75" lengthAdjust="spacingAndGlyphs">T+18m</text>
<text x="846" y="235" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#1a1a1a" text-anchor="middle" textLength="77" lengthAdjust="spacingAndGlyphs">T+21m</text>
<text x="1220" y="235" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#1a1a1a" text-anchor="middle" textLength="81" lengthAdjust="spacingAndGlyphs">T+30m</text>
<text x="516" y="275" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="600" fill="#1a1a1a" text-anchor="middle" textLength="152" lengthAdjust="spacingAndGlyphs">Colapso silencioso</text>
<text x="852" y="275" font-size="23" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="600" fill="#1a1a1a" text-anchor="middle" textLength="199" lengthAdjust="spacingAndGlyphs">Intervenção multi-frente</text>
<text x="1220" y="275" font-size="23" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="600" fill="#1a1a1a" text-anchor="middle" textLength="187" lengthAdjust="spacingAndGlyphs">Recuperação completa</text>
<text x="45" y="424" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#555" text-anchor="start" textLength="106" lengthAdjust="spacingAndGlyphs">DIMENSÃO</text>
<text x="45" y="456" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#555" text-anchor="start" textLength="90" lengthAdjust="spacingAndGlyphs">HUMANA</text>
<text x="42" y="486" font-size="17" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#888" text-anchor="start" font-style="italic" textLength="115" lengthAdjust="spacingAndGlyphs">(não bioquímica)</text>
<text x="44" y="697" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#555" text-anchor="start" textLength="95" lengthAdjust="spacingAndGlyphs">CONTROLE</text>
<text x="45" y="723" font-size="24" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#555" text-anchor="start" textLength="98" lengthAdjust="spacingAndGlyphs">BIOLÓGICO</text>
<text x="42" y="756" font-size="17" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#888" text-anchor="start" font-style="italic" textLength="101" lengthAdjust="spacingAndGlyphs">(marcadores)</text>
<text x="198" y="333" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="109" lengthAdjust="spacingAndGlyphs">Vida sexual</text>
<text x="199" y="362" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="106" lengthAdjust="spacingAndGlyphs">com Marina</text>
<text x="198" y="422" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="172" lengthAdjust="spacingAndGlyphs">Amigos próximos (nº)</text>
<text x="199" y="485" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="146" lengthAdjust="spacingAndGlyphs">Celular no quarto</text>
<text x="199" y="553" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="165" lengthAdjust="spacingAndGlyphs">Propósito profissional</text>
<text x="199" y="615" font-size="18" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="166" lengthAdjust="spacingAndGlyphs">Ritual laico com Marina</text>
<text x="199" y="681" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="154" lengthAdjust="spacingAndGlyphs">PCR ultrassensível</text>
<text x="199" y="708" font-size="18" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="53" lengthAdjust="spacingAndGlyphs">(mg/L)</text>
<text x="199" y="748" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="141" lengthAdjust="spacingAndGlyphs">Cortisol matinal</text>
<text x="199" y="775" font-size="17" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" textLength="57" lengthAdjust="spacingAndGlyphs">(μg/dL)</text>
<text x="440" y="349" font-size="24" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="125" lengthAdjust="spacingAndGlyphs">8 meses sem</text>
<text x="438" y="422" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="24" lengthAdjust="spacingAndGlyphs">0</text>
<text x="438" y="474" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="48" lengthAdjust="spacingAndGlyphs">sim,</text>
<text x="438" y="502" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="158" lengthAdjust="spacingAndGlyphs">checagem 3h–5h</text>
<text x="438" y="553" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="99" lengthAdjust="spacingAndGlyphs">esvaziado</text>
<text x="438" y="620" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="32" lengthAdjust="spacingAndGlyphs">—</text>
<text x="438" y="696" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="50" lengthAdjust="spacingAndGlyphs">1,4</text>
<text x="438" y="764" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="40" lengthAdjust="spacingAndGlyphs">19</text>
<text x="752" y="338" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="187" lengthAdjust="spacingAndGlyphs">retomada incipiente</text>
<text x="752" y="367" font-size="24" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="198" lengthAdjust="spacingAndGlyphs">+ tadalafila 5 mg/dia</text>
<text x="749" y="422" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="13" lengthAdjust="spacingAndGlyphs">1</text>
<text x="752" y="482" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="74" lengthAdjust="spacingAndGlyphs">retirado</text>
<text x="752" y="538" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="184" lengthAdjust="spacingAndGlyphs">mentoria voluntária</text>
<text x="752" y="564" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="73" lengthAdjust="spacingAndGlyphs">iniciada</text>
<text x="752" y="606" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="199" lengthAdjust="spacingAndGlyphs">caminhada silenciosa</text>
<text x="752" y="633" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="90" lengthAdjust="spacingAndGlyphs">dominical</text>
<text x="765" y="696" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="50" lengthAdjust="spacingAndGlyphs">1,0</text>
<text x="765" y="764" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="40" lengthAdjust="spacingAndGlyphs">17</text>
<text x="1127" y="338" font-size="23" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="61" lengthAdjust="spacingAndGlyphs">plena,</text>
<text x="1127" y="368" font-size="24" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="191" lengthAdjust="spacingAndGlyphs">qualidade &gt; pré-IAM</text>
<text x="1124" y="422" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="22" lengthAdjust="spacingAndGlyphs">3</text>
<text x="1127" y="482" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="128" lengthAdjust="spacingAndGlyphs">10 meses sem</text>
<text x="1127" y="551" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="183" lengthAdjust="spacingAndGlyphs">ritual semanal firme</text>
<text x="1127" y="619" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="163" lengthAdjust="spacingAndGlyphs">52 domingos/ano</text>
<text x="1115" y="696" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="55" lengthAdjust="spacingAndGlyphs">0,6</text>
<text x="1115" y="764" font-size="29" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="45" lengthAdjust="spacingAndGlyphs">15</text>
<text x="290" y="850" font-size="42" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="600" fill="#1a1a1a" text-anchor="start" font-style="italic" textLength="755" lengthAdjust="spacingAndGlyphs">“Doutor, eu achei que ia sair dessa história mais frágil.</text>
<text x="290" y="886" font-size="40" font-family="'Cormorant Garamond', 'DejaVu Serif', Georgia, serif" font-weight="600" fill="#1a1a1a" text-anchor="start" font-style="italic" textLength="420" lengthAdjust="spacingAndGlyphs">Eu acho que saí mais inteiro.”</text>
<text x="1230" y="879" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="end" textLength="168" lengthAdjust="spacingAndGlyphs">— Ricardo, T+30m.</text>
<text x="50" y="937" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start" textLength="695" lengthAdjust="spacingAndGlyphs">Fonte: caso-tipo do Capítulo 13. Princeton Consensus III (Nehra et al., Mayo Clinic Proc 2012);</text>
<text x="50" y="962" font-size="20" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start" textLength="458" lengthAdjust="spacingAndGlyphs">AHA Sexual Activity and CVD (Levine et al., Circulation 2012).</text>
