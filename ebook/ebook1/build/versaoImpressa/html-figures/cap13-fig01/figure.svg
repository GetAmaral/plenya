<text x="82" y="875" font-size="48" font-family="'Cormorant Garamond', Georgia, serif" font-weight="900" fill="#fff" text-anchor="middle">i</text>
<text x="121" y="856" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="900" fill="#000" text-anchor="start" textLength="229" lengthAdjust="spacingAndGlyphs">COMO LER ESTE GRÁFICO:</text>
<text x="354" y="856" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="706" lengthAdjust="spacingAndGlyphs"> As barras mostram o quanto o risco de morte aumenta em pessoas que têm o fator (ou estão expostas)</text>
<text x="121" y="883" font-size="19" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="939" lengthAdjust="spacingAndGlyphs">em comparação àquelas que não têm (ou não estão expostas). Valores são aproximados, derivados de meta-análises</text>
<text x="121" y="907" font-size="16" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#000" text-anchor="start" textLength="245" lengthAdjust="spacingAndGlyphs">de grandes estudos populacionais.</text>
<text x="1105" y="860" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="339" lengthAdjust="spacingAndGlyphs">Não é uma comparação direta com a Figura 1 do</text>
<text x="1105" y="879" font-size="16" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="341" lengthAdjust="spacingAndGlyphs">Capítulo 7 (hazard ratios de extremos de aptidão).</text>
<text x="1104" y="902" font-size="15" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="332" lengthAdjust="spacingAndGlyphs">Aqui, as estimativas são populacionais: “com vs.</text>
<text x="1105" y="923" font-size="14" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="87" lengthAdjust="spacingAndGlyphs">sem” o fator.</text>
<text x="43" y="957" font-size="22" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start" font-style="italic" textLength="856" lengthAdjust="spacingAndGlyphs">Fontes: Holt-Lunstad et al. PLOS Medicine, 2010; Holt-Lunstad et al., Perspectives on Psychological Science, 2015;</text>
<text x="43" y="985" font-size="21" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#666" text-anchor="start" font-style="italic" textLength="837" lengthAdjust="spacingAndGlyphs">Banks et al., BMJ, 2015; The Lancet, 2016; Lee et al., Lancet, 2012; WHO Global Health Risks / GBD, 2020.</text>
<text x="1101" y="966" font-size="25" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="349" lengthAdjust="spacingAndGlyphs">Em 2023, o Surgeon General dos EUA classificou</text>
<text x="1100" y="991" font-size="16" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="322" lengthAdjust="spacingAndGlyphs">a solidão como problema de saúde pública de</text>
<text x="1101" y="1013" font-size="16" font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif" font-weight="normal" fill="#555" text-anchor="start" font-style="italic" textLength="140" lengthAdjust="spacingAndGlyphs">prioridade nacional.</text>
