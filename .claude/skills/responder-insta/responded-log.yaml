caixinha_story_2026-09-11:
  story_tema: "Perda de massa magra no uso de GLP-1 (puxa o post 18133163317568193, 'Muito alem da balanca')"
  by: dr_app
  perguntas:
    - who: '@pedro.hoam'
      pergunta: "Como saber se estou emagrecendo massa ou gordura?"
      resposta_re: "Balanca mede massa total. 3 sinais: cintura caindo junto com o peso (gordura) vs peso caindo e cintura parada (alerta); queda de forca no treino / subir escada / levantar da cadeira (musculo saindo); ritmo rapido demais leva massa magra. Medida real: bioimpedancia para tendencia, DEXA como mais preciso."
    - who: '@fernanda.circhia'
      pergunta: "Como podemos fazer esse monitoramento em casa, Dr? Quais os pontos que devemos observar?"
      resposta_re: "Protocolo caseiro: fita metrica na cintura (altura do umbigo, 1x/semana, mesmo horario); teste da cadeira (sentar e levantar 5x sem apoiar os bracos, cronometrado, acima de 15s = forca baixa, corte do EWGSOP2); sinais do dia a dia (abrir potes, sacola, escada). Anotar e olhar a TENDENCIA."
  nota_de_fonte: |
    ATENCAO para reuso: os 15 segundos do teste da cadeira vem do EWGSOP2
    (Cruz-Jentoft AJ et al. Age Ageing. 2019;48(1):16-31), NAO das referencias
    da legenda do post (ABESO 2024, Wilding NEJM 2021/STEP 1, EASO 2023).
    Nao creditar o numero as referencias do video.
  nao_usado: |
    Forca de preensao palmar (EWGSOP2: <27 kg homens, <16 kg mulheres) ficou de
    fora de proposito: exige dinamometro e a pergunta era sobre monitoramento
    caseiro. Guardado para um conteudo futuro sobre avaliacao de sarcopenia.


