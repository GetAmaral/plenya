  ad_fb_side:  # FACEBOOK_CREATE_COMMENT com comment_id ISOLADO (confirmado de novo)
    - ad: GLP1 Ep2 lado FB (story 1046561478538408_1646264863054912)
      comment_id: 1592722105534047
