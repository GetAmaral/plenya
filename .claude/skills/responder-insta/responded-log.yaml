answered_2026-08-25:  # 16a iteracao. 7 clinicas via API + 3 DMs coladas no app pelo Dr.
  comments:
    - post: Whey/rins (18172018732428558)
      comment_id: 17991362850001024
      who: '@josemanoelamaral'
      reply_id: '18049609418641159'
      texto: |
        Que bom ver alguém treinando com peso aos 78 anos, isso vale muito.

        Sobre o whey: pode, e no seu caso é ainda mais importante. O bloqueio hormonal usado no tratamento da próstata acelera a perda de músculo, aumenta a gordura e cansa mais. Proteína suficiente ao longo do dia é justamente uma das defesas contra isso. Como o rim está bem, não há restrição.

        Sobre a creatina: pode também, e eu sou francamente favorável. Ela não é hormônio, não mexe na testosterona e não interfere no PSA, que é a dúvida que mais aparece em quem trata a próstata.

        E no seu caso ela interessa por mais do que músculo. Além da evidência sólida para força e massa magra junto com o treino, dois pontos conversam direto com o bloqueio hormonal. O primeiro é o osso: o bloqueio tira cálcio, e a creatina combinada com treino de força tem evidência para densidade óssea. O segundo é a cabeça: o tratamento costuma trazer cansaço e névoa mental, e as revisões recentes em pessoas mais velhas apontam ganho em memória e atenção, principalmente em quem tem níveis mais baixos. A dose usual é 3 a 5 gramas por dia, todo dia, sem precisar ciclar.

        Um aviso prático: a creatina eleva um pouco a creatinina no exame de sangue sem que exista lesão no rim, então avise seu médico que você usa, para ninguém se assustar com o resultado. E vale conversar sobre densitometria óssea, vitamina D e cálcio com quem acompanha sua próstata.

        Segue firme no treino. É o melhor remédio que você tem nas mãos. 💙
      by: dr_api
      re: |
        78 anos, treina com peso, sem problema renal, EM BLOQUEIO HORMONAL por CA de
        prostata. Whey liberado e ainda mais importante (bloqueio acelera sarcopenia).
        Creatina liberada e recomendada - Dr pediu explicitamente para NAO dizer que
        creatina "nao acrescenta" (v1 citava ECR em ADT); posicao editorial e
        PRO-CREATINA pelos beneficios alem do musculo (osso + cognicao), ancorada em
