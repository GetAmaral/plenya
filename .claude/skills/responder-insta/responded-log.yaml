      texto: |
        Pergunta importante, e aqui o cuidado é maior justamente pelo conjunto.

        Sobre o diabetes, essa é a indicação principal dessa classe de medicamento, então nesse ponto ela conversa bem com o seu caso.

        Sobre o AVC, ter tido um AVC não impede o uso. Os estudos grandes com essa família de medicamentos mostram redução do risco de novos eventos, inclusive de novo AVC, em quem já tem doença cardiovascular. Mas existe uma diferença que muda tudo: se o AVC foi agora, na fase aguda ou nas primeiras semanas, o momento é de estabilizar primeiro, e quem dá esse tempo é o neurologista.

        A pressão oscilando muito é o que eu olharia antes de qualquer coisa. Oscilação pede investigação, e vale entender a causa antes de somar um remédio novo.

        Dois cuidados práticos: se você usa insulina ou remédios como glibenclamida, gliclazida ou glimepirida, a dose costuma precisar de ajuste para evitar hipoglicemia. E se o AVC deixou alguma sequela de força ou de engolir, atenção redobrada com enjoo, hidratação e proteína, para não perder músculo.

        No seu caso, a princípio vale considerar, mas com neurologista e endocrinologista avaliando juntos, com seus exames na mão. Leva essa conversa pra eles. Melhoras 💙
