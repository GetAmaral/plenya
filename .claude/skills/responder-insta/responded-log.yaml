    - post: GLP1 Ep5 efeitos colaterais (17890054353438587)
      comment_id: 17950786758215790
      who: '@daianevieiraeleo'
      reply_id: '18140040223515918'
      texto: |
        Daiane, o que você descreve é bem típico do começo: sensação de estômago cheio, arrotos e refluxo ao deitar. A semaglutida deixa o estômago mais lento de propósito, e quando você deita o conteúdo sobe com mais facilidade. Costuma melhorar conforme o corpo se adapta.

        Mas tem um ponto na sua mensagem que eu preciso destacar. A dose de 2,4 mg é a dose máxima do Wegovy, e normalmente só se chega nela depois de subir aos poucos, começando em 0,25 mg e passando por 0,5, 1 e 1,7, cada etapa por cerca de quatro semanas. Se você começou direto no 2,4, isso sozinho explica a intensidade do que está sentindo, e vale confirmar com quem prescreveu, hoje se possível. Se foi só a apresentação da caneta e você está numa dose menor, aí fica mais tranquilo.

        Sobre não ter mais vesícula: uma boa notícia é que o risco de cálculo e de crise de vesícula, que existe com esses remédios, deixa de te preocupar. Por outro lado, sem a vesícula a bile chega ao intestino de forma contínua, e isso pode somar no desconforto digestivo.

        O que ajuda agora: pratos pequenos, comer devagar, segurar na gordura, não deitar nas duas a três horas depois de comer e elevar a cabeceira da cama.

        Procure atendimento se vier vômito que não para, se você não conseguir manter líquidos ou se surgir dor forte na barriga. E fala com seu médico sobre esses sintomas, porque reduzir a dose por um tempo é uma opção legítima e comum. 💙
      by: dr_api
      re: |
        ALERTA: relatou 4 dias de Wegovy dizendo dose 2,4 mg (dose MAXIMA; escalonamento
        padrao e 0,25->0,5->1->1,7->2,4). Sem vesicula. Sintomas de esvaziamento lento
        (empachamento, arrotos, refluxo noturno). Resposta sinaliza a questao da dose SEM
        acusar erro de prescricao, pede confirmacao com quem prescreveu, da medidas
        praticas e sinais de alerta. ACOMPANHAR se ela responder.
    - post: GLP1 Ep1 organic (18091184708043047)
      comment_id: 17888373063612129
      who: '@andreacasinilucas'
      reply_id: '17997352877806356'
      texto: |
        Pergunta muito pertinente, e como nefrologista te digo que esse é um caso em que o medicamento tem bastante a oferecer.

        Primeiro para tranquilizar: a contraindicação dessa classe é específica para câncer medular de tireoide e para a síndrome NEM2, o que não é o caso dele. Câncer de rim já retirado não impede o uso. Inclusive, estudos recentes em pessoas que retiraram o rim por câncer mostraram menos complicações depois da cirurgia e melhor sobrevida entre quem usava esses medicamentos.

        Sobre a escolha do Ozivy no lugar do Mounjaro, o endocrinologista dele tem os motivos olhando o caso completo. Vale saber que o Ozivy é semaglutida, a mesma molécula do Ozempic e do Wegovy, e é a que tem mais tempo de estrada e os dados mais consolidados de proteção do rim. Faz sentido.

        O que eu acrescentaria, pensando no rim que sobrou: ele passa a trabalhar dobrado, e com o tempo isso cobra um preço, com mais chance de pressão alta, de perda de proteína na urina e de doença renal crônica. A obesidade acelera esse processo, então emagrecer é dos cuidados mais protetores que ele pode ter agora.

        Na prática, peça ao médico para acompanhar creatinina, taxa de filtração e albuminúria pelo menos uma vez por ano, e reforce a hidratação nas primeiras semanas, porque enjoo que corta a ingestão de água pesa mais em quem tem um rim só. E manter o seguimento com o urologista.

        Ele está em boas mãos. 💙
      by: dr_api
      re: |
        Marido com CA de rim ja retirado, endocrino indicou Ozivy e nao Mounjaro.
        CA renal retirado nao contraindica (contraindicacao e CA medular tireoide/NEM2);
        estudos TriNetX mostram menos complicacoes pos-nefrectomia e melhor sobrevida com
        GLP-1. Bloco nefrologico (RAG): rim unico hiperfiltra, TFG 60-70% do basal,
        albuminuria 25-30% em 10 anos, HAS dobra, DRC pos-nefrectomia 20-40%. Monitorar
        creatinina+TFG+albuminuria anual, hidratar no inicio.
    - post: GLP1 Ep2 organic (18337463062212973)
      comment_id: 17977182573085996
      who: '@josilenegnr'
      reply_id: '18096971774635540'
      texto: |
        Pergunta ótima, e vou ser honesto com você porque a resposta tem duas partes.

        O que a ciência já mostra é que essa classe de medicamento melhora o ambiente onde a placa cresce: reduz a inflamação, o açúcar, a pressão, o peso e melhora o colesterol. Em estudos houve redução da espessura da parede da carótida, que é um marcador precoce de aterosclerose. E, olhando desfecho de verdade, esses remédios reduzem o risco de infarto e de AVC.

        O que ainda não dá para afirmar é que eles diminuam a placa que já está formada. Um ensaio com mais de 600 pessoas acompanhadas por um ano e meio não encontrou mudança no volume nem na composição da placa da carótida.

        Quem move o ponteiro da placa mesmo é outro conjunto: baixar bastante o LDL, o colesterol ruim, com estatina e o que mais for preciso, controlar a pressão, parar de fumar e manter atividade física. Aí sim existem estudos de imagem mostrando estabilização e até alguma regressão.

        Esse medicamento soma, mas não substitui o tratamento da placa. Vale levar seu exame da carótida e seu colesterol pro seu médico e montar o plano completo. 💙
      by: dr_api
      re: |
        "Ajuda a reduzir as placas nas carotidas?" Resposta HONESTA (contraria em parte a
        expectativa do Reel): GLP-1 reduz espessura intima-media e risco de infarto/AVC,
        mas ECR com exenatida (631 pessoas/18 meses) NAO mostrou mudanca de volume nem
        composicao da placa. Quem move placa e LDL baixo + PA + parar de fumar + atividade.
