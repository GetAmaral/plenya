      texto: |
        Pergunta importante, e aqui vale atenção redobrada.

        Quem já tem pedra na vesícula não está proibido de usar, mas precisa de avaliação antes. Esses medicamentos aumentam um pouco o risco de problema de vesícula por dois motivos: deixam a vesícula mais preguiçosa para esvaziar, e a própria perda de peso rápida favorece a formação de cálculo. Numa revisão grande, com dezenas de estudos e mais de cem mil pessoas, o risco de doença biliar foi cerca de um terço maior.

