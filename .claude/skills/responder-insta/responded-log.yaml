        oscila mt, to com AVC, posso tomar monjaro?". Tratada a ambiguidade de "to com AVC"
        (sequela x evento recente) cobrindo os dois cenarios. DM2 e a indicacao principal;
        AVC previo nao impede (SELECT incluiu AVC previo; meta-analise SELECT+FLOW: -15% de
        AVC; SURPASS-CVOT/NEJM dez-2025: tirzepatida nao-inferior a dulaglutida em MACE-3,
        12,2% vs 13,1%). AVC agudo/recente = estabilizar primeiro com neurologista. Pressao
