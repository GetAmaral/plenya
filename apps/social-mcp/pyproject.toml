[project]
name = "plenya-social-mcp"
version = "0.1.0"
description = "MCP server for Plenya — Instagram + Facebook automation via Meta Graph API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
plenya-social-mcp = "plenya_social.server:main"
plenya-social-oauth = "plenya_social.oauth_setup:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
