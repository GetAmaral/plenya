appId: com.plenya.app
tags:
  - smoke
  - auth
---
# Smoke test: login do paciente (senha) → biometric/lgpd consent → home tabs.
#
# Variáveis (definir em ~/.maestro/secrets.yaml ou via --env):
#   MAESTRO_PATIENT_EMAIL
#   MAESTRO_PATIENT_PASSWORD

- launchApp:
    clearState: true
    permissions:
      notifications: allow

- assertVisible: 'Plenya'

- tapOn:
    id: 'email'
- inputText: ${MAESTRO_PATIENT_EMAIL}

- tapOn:
    id: 'password'
- inputText: ${MAESTRO_PATIENT_PASSWORD}

- tapOn: 'Entrar'

- runFlow:
    when:
      visible: 'Termo de uso e LGPD'
    commands:
      - tapOn: 'Aceitar e continuar'

- runFlow:
    when:
      visible: 'Proteção biométrica'
    commands:
      - tapOn: 'Desbloquear'

- assertVisible:
    text: 'Início'
- assertVisible:
    text: 'Treino'
- assertVisible:
    text: 'Exames'
- assertVisible:
    text: 'Mensagens'
- assertVisible:
    text: 'Perfil'
