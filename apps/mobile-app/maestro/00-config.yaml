appId: com.plenya.app
---
# Configuração base — herdada por todos os flows do app paciente.
# Roda contra build de development apontando pra api-staging.
#
# Pré-requisitos:
#   1. Patient fixture criado no staging (ver scripts/seed-maestro-patient.sql)
#   2. expo-dev-client buildado e instalado no device
#   3. Bundler rodando: pnpm --filter @plenya/mobile-app start
#
# Execução local:
#   maestro test apps/mobile-app/maestro/01-login.yaml
#
# Execução em CI (Maestro Cloud):
#   maestro cloud --apiKey $MAESTRO_API_KEY --branch $GITHUB_REF \
#     --include-tags smoke apps/mobile-app/maestro/
