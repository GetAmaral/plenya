<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum Plenya · Preview</title>
<style>
:root {
  --petrol:      #063b4f;
  --petrol-dark: #041F2A;
  --gold:        #b38645;
  --gold-soft:   #d4a86b;
  --cream:       #eae7da;
  --sage:        #92b8b4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--petrol-dark);
  color: var(--cream);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  line-height: 1.5;
  padding: 32px;
  min-height: 100vh;
}
header {
  max-width: 1600px;
  margin: 0 auto 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(179, 134, 69, 0.25);
}
h1 {
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  font-weight: 500;
  font-size: 36px;
  letter-spacing: -0.01em;
  color: var(--cream);
  margin-bottom: 8px;
}
.subtitle {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
}
.meta {
  color: rgba(234, 231, 218, 0.55);
  font-size: 13px;
  margin-top: 12px;
}
.controls {
  color: rgba(234, 231, 218, 0.45);
  font-size: 12px;
  margin-top: 6px;
}
main {
  max-width: 1600px;
  margin: 0 auto;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 20px;
}
.slide-card {
  background: var(--petrol);
  border: 1px solid rgba(179, 134, 69, 0.15);
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 200ms, transform 200ms;
  display: flex;
  flex-direction: column;
}
.slide-card:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
}
.thumb {
  aspect-ratio: 16 / 9;
  background: var(--petrol-dark);
  position: relative;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.thumb .missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(234, 231, 218, 0.3);
  font-size: 13px;
  font-style: italic;
}
.card-footer {
  padding: 12px 16px;
  font-size: 13px;
  border-top: 1px solid rgba(179, 134, 69, 0.12);
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.card-num {
  color: var(--gold);
  font-weight: 600;
  letter-spacing: 0.12em;
  font-size: 11px;
  min-width: 28px;
}
.card-title {
  color: var(--cream);
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  line-height: 1.3;
}

/* Fullscreen overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(4, 31, 42, 0.98);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 40px;
  flex-direction: column;
  gap: 16px;
}
.overlay.active { display: flex; }
.overlay-img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
}
.overlay-info {
  color: var(--cream);
  text-align: center;
  font-size: 13px;
}
.overlay-info .num {
  color: var(--gold);
  letter-spacing: 0.2em;
  font-weight: 600;
}
.overlay-info .title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  margin-top: 4px;
}
.overlay-controls {
  color: rgba(234, 231, 218, 0.5);
  font-size: 11px;
  letter-spacing: 0.1em;
}
.overlay-close {
  position: absolute;
  top: 24px;
  right: 24px;
  background: transparent;
  color: var(--cream);
  border: 1px solid rgba(234, 231, 218, 0.3);
  width: 40px;
  height: 40px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 50%;
}
.overlay-close:hover { border-color: var(--gold); color: var(--gold); }
.nav-arrows {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 32px;
  pointer-events: none;
  align-items: center;
}
.nav-arrow {
  background: rgba(179, 134, 69, 0.18);
  color: var(--cream);
  border: none;
  width: 48px;
  height: 48px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 50%;
  pointer-events: all;
  transition: background 150ms;
}
.nav-arrow:hover { background: var(--gold); color: var(--petrol-dark); }
</style>
</head>
<body>

<header>
  <h1>Continuum Plenya · Deck Preview</h1>
  <div class="subtitle">Slides 1920×1080 · 16:9</div>
  <div class="meta">Edite <code>deck.html</code> → rode <code>node render-pngs.js</code> → recarregue esta página.</div>
  <div class="controls">Clique para fullscreen · ← → navega · ESC fecha · ESPAÇO avança</div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay">
  <button class="overlay-close" onclick="closeOverlay()">✕</button>
  <div class="nav-arrows">
    <button class="nav-arrow" onclick="navigate(-1)">‹</button>
    <button class="nav-arrow" onclick="navigate(1)">›</button>
  </div>
  <img class="overlay-img" id="overlay-img" alt="">
  <div class="overlay-info">
    <div class="num" id="overlay-num"></div>
    <div class="title" id="overlay-title"></div>
  </div>
  <div class="overlay-controls">← → navegar · ESC fechar · ESPAÇO avançar</div>
</div>

<script>
const SLIDES = [
  { n: "01", title: "Hook · A década silenciosa" },
  { n: "02", title: "A janela silenciosa · HbA1c" },
  { n: "03", title: "Você se acostuma · 5 sintomas categorizados" },
  { n: "04", title: "20 anos de nefrologia · Getúlio" },
  { n: "05", title: "Continuum · apresentação" },
  { n: "06", title: "Slide 6" },
  { n: "07", title: "Crença 1" },
  { n: "08", title: "Crença 2" },
  { n: "09", title: "Crença 3" },
  { n: "10", title: "Slide 10" },
  { n: "11", title: "Slide 11" },
  { n: "12", title: "Escore Plenya · radar" },
  { n: "13", title: "Jornada" },
  { n: "14", title: "Box Plenya" },
  { n: "15", title: "Equipe" },
  { n: "16", title: "Slide 16" },
  { n: "17", title: "Consulta vs Continuum" },
  { n: "18", title: "Slide 18" },
  { n: "19", title: "Triagem · fechamento" },
];

let currentIdx = 0;

const grid = document.getElementById("grid");
SLIDES.forEach((s, idx) => {
  const card = document.createElement("div");
  card.className = "slide-card";
  card.dataset.idx = idx;
  card.innerHTML = `
    <div class="thumb">
      <img src="previews/slide-${s.n}.png" alt="Slide ${s.n}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="missing" style="display:none;">slide-${s.n}.png não gerado</div>
    </div>
    <div class="card-footer">
      <span class="card-num">${s.n}</span>
      <span class="card-title">${s.title}</span>
    </div>
  `;
  card.addEventListener("click", () => openOverlay(idx));
  grid.appendChild(card);
});

const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlay-img");
const overlayNum = document.getElementById("overlay-num");
const overlayTitle = document.getElementById("overlay-title");

function openOverlay(idx) {
  currentIdx = idx;
  const s = SLIDES[idx];
  overlayImg.src = `previews/slide-${s.n}.png?t=${Date.now()}`;
  overlayNum.textContent = `${s.n} / ${SLIDES.length}`;
  overlayTitle.textContent = s.title;
  overlay.classList.add("active");
}

function closeOverlay() {
  overlay.classList.remove("active");
}

function navigate(delta) {
  const newIdx = currentIdx + delta;
  if (newIdx >= 0 && newIdx < SLIDES.length) openOverlay(newIdx);
}

document.addEventListener("keydown", (e) => {
  if (!overlay.classList.contains("active")) return;
  if (e.key === "ArrowRight" || e.key === " ") {
    e.preventDefault();
    navigate(1);
  } else if (e.key === "ArrowLeft") {
    navigate(-1);
  } else if (e.key === "Escape") {
    closeOverlay();
  }
});
</script>

</body>
</html>
