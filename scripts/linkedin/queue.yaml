- slug: escore-de-calcio-coronariano-o-exame-que-muda-uma-decada
  block: 2
  order: 10
  status: published
  scheduled_at: '2026-06-02 13:11:00-03:00'
  commentary: 'Atendo recorrentemente um perfil que se repete: homem entre 40 e 50 anos, exames de sangue todos dentro da
    referência, pai que infartou cedo. Vem com a frase que reconheço de longe: "o cardiologista do meu pai disse que tava
    tudo bem com ele um ano antes do infarto. Quero saber o que tá acontecendo dentro de mim."


    Pelo painel convencional, esses pacientes são "baixo risco". Risco a 10 anos pela AHA: 4 a 6%. Liberados pra seguir a
    vida.


    Peço um escore de cálcio coronariano. Em casos assim, não é raro o resultado vir acima do percentil 90 pra idade: escore
    de 150, 200, 300. Doença instalada e silenciosa, em homem que se considerava saudável.


    O CAC é uma tomografia do coração sem contraste, sem agulha. Dose de radiação comparável a uma mamografia. Quinze minutos
    da chegada à saída. O que ele faz é quantificar cálcio nas paredes das coronárias. Cálcio coronariano só existe se houver
    placa aterosclerótica calcificada. Não é falso positivo. É a impressão digital de uma doença que se instalou em silêncio,
    enquanto os exames de sangue diziam "normal".


    O MESA, publicado por Detrano no NEJM em 2008, acompanhou 6.722 adultos. Comparado com escore zero, o risco de evento
    coronariano foi 7,73× maior em quem tinha CAC entre 101 e 300, e 9,67× em quem tinha acima de 300. Independente de colesterol,
    pressão, diabetes, tabagismo. A diretriz AHA/ACC 2018 incorporou o exame formalmente pra reclassificar risco intermediário.


    Em paciente que volta um ano depois com o painel corrigido (LDL alvo, ApoB alvo, peso ajustado, treino estruturado), o
    escore calcificado não regride. Placa calcificada raramente regride. Mas a velocidade de progressão muda. E o risco real
    de evento, na próxima década, é recalibrado de uma forma que nenhuma fórmula tradicional teria conseguido.


    Coração que infarta aos 55: a artéria começou a sofrer aos 35. Esse exame de quinze minutos é, na minha opinião, a coisa
    mais próxima de uma máquina do tempo que existe em prevenção cardiovascular.

    '
