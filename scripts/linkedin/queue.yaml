- slug: lipoproteina-a-exame-que-cardiologista-nao-pediu
  block: 2
  order: 11
  status: published
  scheduled_at: '2026-06-03 09:02:00-03:00'
  commentary: 'Uma em cada cinco pessoas tem lipoproteína(a) elevada e quase nunca soube. É hereditária, codificada por um
    único gene (LPA), e o nível permanece praticamente constante a vida toda, dieta, estatina e treino não modificam significativamente
    o valor.


    Atendo recorrentemente um perfil que ilustra o problema: homem entre 35 e 45 anos, magro, atleta amador, lipidograma "normal".
    Pai infartou cedo, tio infartou cedo, avô infartou cedo. "Disseram que era hereditário, mas comigo seria diferente porque
    eu treino."


    Peço Lp(a). Vem em torno de 180 nmol/L (referência abaixo de 75). Peço escore de cálcio coronariano. Vem com placa subclínica
    em alguém de 39 anos, magro e atleta.


    O treino não blinda. A Lp(a) é genética e estável, e saber o valor antes dos 40 muda toda a estratégia preventiva subsequente,
    alvos de ApoB mais agressivos, decisão de estatina mais cedo, rastreamento dos irmãos e filhos.


    A revisão de Tsimikas no JACC em 2017 sintetizou a magnitude: 20 a 25% da população geral tem Lp(a) acima do limite de
    risco. Em afrodescendentes, 30 a 40%. Pessoas no quintil superior têm risco 2 a 3 vezes maior de infarto, AVC isquêmico
    e estenose aórtica calcificada. A análise de Burgess (JAMA Cardiology 2018) estabeleceu a relação como causal, não apenas
    associativa.


    O consenso da Sociedade Europeia de Aterosclerose (Kronenberg, European Heart Journal 2022) trouxe a recomendação prática:
    medir Lp(a) ao menos uma vez na vida em todo adulto. Uma vez basta. O cartão de visita biológico você herdou, e ele não
    muda. Confesso, sem lirismo: também demorei a incorporar Lp(a) na rotina. Aprendi pedindo errado por anos.


    Quando o valor vem alto, a conduta não é esperar terapia específica. Os dois principais ensaios de fase 3 saem em 2026:
    HORIZON com pelacarsen (antissense, Novartis) e OCEAN(a) com olpasiran (siRNA, Amgen), com reduções de Lp(a) de 80 a 95%
    já demonstradas em fase 2. Aprovação regulatória ainda não. Enquanto isso, é derrubar com mais agressividade tudo o que
    se pode modificar: ApoB abaixo de 80, pressão abaixo de 130/80, glicemia controlada, tabagismo zero. E rastreamento familiar
    em cascata: filhos, irmãos, sobrinhos. Se você tem Lp(a) alta, há 50% de chance de cada filho carregar.


    Lp(a) hoje entra no meu painel inicial, junto com ApoB e os marcadores cardiometabólicos. É informação estrutural sobre
    o risco cardiovascular do paciente pelas próximas quatro décadas, medida uma única vez na vida.

    '
