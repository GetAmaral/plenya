- slug: quando-tudo-normal-nao-basta
  block: 1
  order: 6
  status: published
  scheduled_at: '2026-05-21 13:09:00-03:00'
  commentary: '"Doutor, eu fiz check-up há quatro meses, está tudo normal, mas eu sinto que não está."


    É a frase que mais escuto desde que comecei na nefrologia. E ela não envelheceu nada. A pessoa não está delirando. Está
    percebendo algo que o exame não foi desenhado pra mostrar. E quase sempre, a razão clínica está do lado do corpo.


    A faixa "normal" do laboratório responde a uma pergunta específica: este resultado está perto da média de pessoas de idade
    e sexo parecidos?


    É um filtro útil pra diagnosticar doença instalada. É péssimo pra detectar trajetória.


    Porque a média da população brasileira de 45 anos inclui sedentarismo, sobrepeso, alimentação industrializada, sono insuficiente
    e estresse crônico não tratado. Quando seu exame está "dentro da faixa", o que isso quer dizer é: você está parecido com
    a média de uma população que está adoecendo lentamente.


    Isso não é elogio sobre a sua saúde; é apenas descrição estatística.


    E não basta medir uma vez. Trajetória é leitura no tempo. Formado, eu também era do "volte daqui a um ano". Demorei a
    aprender que check-up anual com doze marcadores básicos não captura o que se move em décadas. Diabetes não cai do céu:
    fecha conta acumulada por quinze, vinte anos.


    Organizei essa leitura no Escore Plenya, que cruza mais de 800 itens: história, sintomas, hábitos, medicamentos, exames.
    Cada um pesado e lido em contexto. O resultado é um mapa: o que está bem, o que está em margem, o que precisa intervenção
    agora.


    A pessoa sai sabendo em qual trajetória está. Não "tudo normal", não "tudo doente", mas o ponto exato em que o corpo está
    naquele momento.


    A pergunta clínica que importa não é "estou com doença?". É "estou bem, ou estou apenas sem diagnóstico?". São perguntas
    diferentes, e a resposta de uma não serve para a outra.

    '
