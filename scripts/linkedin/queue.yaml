- slug: normal-versus-otimo
  block: 1
  order: 2
  status: published
  scheduled_at: '2026-05-13 07:30:00-03:00'
  commentary: 'A diferença entre uma insulina de jejum 8 e uma de 25 não é apenas gradação dentro da faixa normal: é um abismo
    metabólico.


    Ambas saem do laboratório com a mesma palavra carimbada: normal.


    Recebo no consultório, semana após semana, pacientes com laudos cheios desse "normal", mas com corpos a poucos anos da
    resistência insulínica clínica, esteatose, síndrome metabólica. Eles vieram dizer que está tudo certo. Vieram pedir uma
    segunda leitura porque algo não fecha.


    Petersen e colegas mostraram no NEJM em 2004 algo que demorei a digerir: filhos de diabéticos, com insulina ainda dentro
    da faixa "normal", já apresentam disfunção mitocondrial intramuscular detectável. O dano metabólico precede o diagnóstico
    em uma a duas décadas.


    O mesmo padrão se repete em ApoB, hs-CRP, homocisteína, ferritina, vitamina D, TG/HDL. Em cada um existe uma faixa "normal"
    (construída pra flagrar doença instalada) e uma faixa "ótima" (compatível com saúde plena). A distância entre as duas
    é onde mora a janela silenciosa.


    Reler exame sob a lente do ótimo não exige aparelho novo, nem laboratório caro. Exige outra pergunta.


    Foi pra essa pergunta que escrevi Antes. É a pergunta que tento ensinar a cada paciente que entra no consultório.


    A faixa normal foi calibrada pra triagem de doença instalada, não pra orientar prevenção nos próximos vinte anos. São
    perguntas diferentes que exigem cortes diferentes.

    '
