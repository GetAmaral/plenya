# LinkedIn publishing queue — Dr. Getúlio
#
# State file consumed by publisher.py (cron) and /linkedin-week skill.
# Versionado no repo. Não contém segredos (token mora em .env).
#
# Workflow:
#   1. Skill /linkedin-week (semanal): pega próximos N posts em status=draft,
#      gera commentary, define scheduled_at, marca status=approved.
#   2. publisher.py (cron, a cada 15min): pega posts com
#      status=approved AND scheduled_at <= now, publica via LinkedIn API,
#      marca status=published + grava post_urn.

config:
  cadence:
    days: [Tue, Wed, Thu]      # warmup pode usar 2/sem (Ter+Qui), depois 3/sem
    time: "07:30"
    timezone: America/Sao_Paulo
  visibility: PUBLIC
  source_blog_dir: apps/site-getulio/content/blog/pt
  images_dir: apps/site/public/images/blog       # figuras dos posts ficam aqui

# Ordenação por bloco — manifesto → exames → síndromes → método.
# Razão: maximizar reach inicial com conceitos âncora antes de aprofundar.

posts:
  # ─── BLOCO 1 — Manifesto + assinatura conceitual ───────────────────────
  - slug: janela-silenciosa-introducao
    block: 1
    order: 1
    status: published
    scheduled_at: "2026-05-12 16:00:00-03:00"
    published_at: "2026-05-12 16:00:00-03:00"
    post_urn: urn:li:share:7460042081005182978
    commentary: |
      O laboratório diz "normal". O corpo diz: estou adoecendo há oito anos e ninguém está olhando.

      Vinte anos entre enfermaria, hemodiálise, terapia intensiva e ambulatório me ensinaram a desconfiar dessa palavra.

      A faixa "normal" do exame foi construída para flagrar doença instalada — não para sustentar saúde plena. Entre o que o laboratório consegue chamar de doença e o que o corpo consegue como condição ótima existe um intervalo de dez a vinte anos em que tudo acontece em silêncio.

      Insulina de jejum em 22: normal. Ferritina em 38: normal. ApoB em 110: normal.

      Cada um desses números, "normais" no laudo, representa um corpo já em rota de doença. Reler exames sob a lente do ótimo não exige aparelho novo. Exige outra pergunta.

      Foi para essa pergunta que escrevi Antes — e é essa pergunta que conduzo na Plenya, em Londrina, com equipe multidisciplinar e leitura clínica longitudinal.

      A diferença entre intervir agora e intervir depois do diagnóstico é a diferença entre construir longevidade e administrar morbidade.

      Aprendi isso da forma mais dura — vendo rim destruído quando a janela já tinha fechado.

      Começa antes.

      📕 Antes — em português (paperback e Kindle) e em inglês.
    image_path: apps/site/public/images/blog/normal-versus-otimo/figura-1.webp
    image_title: "Normal vs Ótimo — Insulina de jejum"

