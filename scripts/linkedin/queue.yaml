- slug: medicina-2-vs-3
  block: 1
  order: 4
  status: published
  scheduled_at: '2026-05-19 12:31:00-03:00'
  commentary: 'A diferença entre Medicina 2.0 e Medicina 3.0 é a diferença entre um alarme de incêndio e um detector de fumaça.


    O alarme toca quando já está queimando. O detector toca quando a fumaça começa.


    Aprendi a Medicina 2.0 na faculdade e pratiquei por anos: enfermaria, UTI, emergência. Tratar a doença instalada. Escolher
    o remédio certo, fazer a cirurgia certa no momento em que tudo já está acontecendo. É o que sei fazer.


    A Medicina 3.0 não substitui a 2.0. Acrescenta o ato um. Procura a fumaça antes da chama. Trabalha com biomarcadores que
    se movem cinco, dez, vinte anos antes do diagnóstico: insulina de jejum, ApoB, PCR ultrassensível, homocisteína, VO₂ máx,
    força de preensão.


    ApoB mede o número real de partículas aterogênicas e desvia antes do colesterol total se mexer. VO₂ máx é o marcador prognóstico
    de mortalidade total mais poderoso já estudado. Mais forte que tabagismo. A American Heart Association defende que aptidão
    cardiorrespiratória deve ser tratada como sinal vital. hs-CRP conecta inflamação subclínica a infarto e AVC mesmo com
    LDL controlado.


    Lembro de Ricardo, 52 anos. Fazia check-up todo ano. Todos os exames "normais". Quase morreu de infarto num estacionamento.
    Os seis marcadores que estavam fora do ótimo nunca apareceram no painel convencional. O alarme só tocou quando o fogo
    já tinha começado.


    Esse caso me empurrou a repensar o que peço. A pergunta que importa não é "estou com doença?". É: "estou no caminho dela?"


    Foi com essa pergunta que escrevi Antes. E é com ela que organizo minha leitura clínica hoje.


    Esperar o ato dois pra agir, na minha leitura, é esperar demais na maior parte dos casos que vejo no consultório.

    '
