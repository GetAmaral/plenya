- slug: cardio-reno-metabolico
  block: 1
  order: 7
  status: published
  scheduled_at: '2026-05-26 09:03:00-03:00'
  commentary: 'Quem treina em nefrologia aprende cedo uma coisa: o rim costuma sinalizar primeiro.


    O motivo é fisiológico. O glomérulo é uma máquina de filtragem de altíssima precisão sobre um leito vascular delicado.
    Pequenas alterações de pressão, glicose, inflamação ou perfil lipídico aparecem na função renal antes de se traduzirem
    em outros pontos do laudo.


    Microalbuminúria pode aparecer antes de o ApoB se desorganizar. Antes de o escore de cálcio mostrar placa. Antes de a
    glicemia de jejum sair da faixa. Antes de o ecocardiograma mostrar dilatação.


    O eixo cardio-reno-metabólico, formalizado pela American Heart Association em 2023, é a integração formal de algo que
    cardiologistas, endocrinologistas e nefrologistas já viam clinicamente há tempos: coração, rim e metabolismo compartilham
    raiz inflamatória, hemodinâmica e metabólica. São um único sistema sob três janelas diferentes.


    Os ensaios da última década costuraram a leitura. DAPA-CKD (NEJM 2020): dapagliflozina reduziu progressão renal e morte
    cardiovascular mesmo em não-diabéticos. EMPA-KIDNEY (NEJM 2023): empagliflozina confirmou em coorte ampla. FIDELIO-DKD
    (NEJM 2020): finerenona reduziu eventos renais e cardiovasculares em diabetes tipo 2. FLOW (NEJM 2024): semaglutida reduziu
    24% no desfecho renal-cardiovascular composto.


    Três classes diferentes, três alvos diferentes. Todas protegendo os três sistemas em paralelo. A confirmação clínica de
    que o eixo é real e atuável.


    Integro o Comitê Cardiorrenal da Sociedade Brasileira de Nefrologia, e a discussão lá tem sido como traduzir essa evidência
    pra prática brasileira: quem se beneficia, em que momento, com qual sequência.


    No consultório, leio função renal com a mesma atenção com que leio o painel cardio-metabólico. Microalbuminúria de 25,
    taxa de filtração estimada caindo um ponto por ano em quem deveria estar estável: são sinais que organizam dez, quinze
    anos seguintes.


    No conjunto, função renal entendida nesse eixo amplia a janela de intervenção em uma a duas décadas em relação ao painel
    cardiovascular convencional isolado.

    '
