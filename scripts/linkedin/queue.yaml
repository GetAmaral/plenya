- slug: healthspan-vs-lifespan-comprimir-a-morbidade
  block: 1
  order: 5
  status: published
  scheduled_at: '2026-05-20 07:41:00-03:00'
  commentary: 'O João tem 78 anos. Diabetes desde os 64, infarto aos 68, fibrilação atrial aos 72, prótese de quadril aos
    74, fratura de fêmur aos 76. Onze comprimidos por dia. Caminha com bengala desde os 71.


    Veio à consulta acompanhado da filha. Disse uma frase que ficou gravada: "Doutor, eu vivi muito. Mas faz dez anos que
    não vivo bem."


    A filha escutou em silêncio. Tem 50 anos. Veio com a pergunta que reorganizou minha medicina: não é quanto eu vou viver.
    É quantos anos eu vou viver bem.


    Lifespan é quanto você vive. Healthspan é quanto você vive bem: sem doença incapacitante, sem perda de função que tire
    autonomia. A diferença entre os dois números está aumentando no mundo todo.


    JAMA Network Open, dezembro 2024: 183 países, vinte anos de dados. O gap global cresceu de 8,5 para 9,6 anos. Quase uma
    década vivida em estado de doença. EUA 12,4. Brasil em torno de 9,5. Mulheres com 2,4 anos a mais, porque vivem mais tempo
    na fase em que as não-transmissíveis cobram a conta.


    E o teto da expectativa de vida está desacelerando (Nature Aging, 2024). Chegar aos 110 é, pra vasta maioria, ilusão.
    Chegar aos 85 com cabeça lúcida, perna firme e autonomia é meta diferente, realista e modificável.


    A filha do João tem ApoB 124, insulina 13, cintura 92, sono fragmentado, treino só caminhada três vezes por semana. Sem
    força. Tem mais ou menos os marcadores que o pai tinha aos 50. A diferença é que ela está olhando isso aos 50, não aos
    68.


    Essa diferença, na minha experiência, é a variável mais determinante.


    Os anos que separam viver muito de viver bem não são destino: são consequência do que se faz nas três décadas anteriores.
    Comprimir a morbidade exige começar cedo, sustentar consistência, e medir no caminho. É um trabalho ativo. O outro caminho,
    o da inação, também produz resultado, só que o resultado é o do João.

    '
