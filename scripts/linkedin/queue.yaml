  commentary: 'O laboratório diz "normal". O corpo diz: estou adoecendo há oito anos e ninguém está olhando.


    Vinte anos entre enfermaria, hemodiálise, terapia intensiva e ambulatório me ensinaram a desconfiar dessa palavra.


    A faixa "normal" do exame foi construída para flagrar doença instalada, não para sustentar saúde plena. Entre o que o
    laboratório consegue chamar de doença e o que o corpo consegue como condição ótima existe um intervalo de dez a vinte
    anos em que tudo acontece em silêncio.


    Insulina de jejum em 22: normal. Ferritina em 38: normal. ApoB em 110: normal.


    Cada um desses números, "normais" no laudo, representa um corpo já em rota de doença. Reler exames sob a lente do ótimo
    não exige aparelho novo. Exige outra pergunta.


    Foi para essa pergunta que escrevi Antes. É a pergunta que conduzo na Plenya, em Londrina, com equipe multidisciplinar
    e leitura clínica longitudinal.


    A diferença entre intervir agora e intervir depois do diagnóstico é a diferença entre construir longevidade e administrar
    morbidade.


    Aprendi isso da forma mais dura: vendo rim destruído quando a janela já tinha fechado.


    Começa antes.


    📕 Antes, em português (paperback e Kindle) e em inglês.

    '
