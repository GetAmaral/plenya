- slug: quatro-assassinos-silenciosos-depois-dos-40
  block: 1
  order: 8
  status: published
  scheduled_at: '2026-05-27 07:38:00-03:00'
  commentary: 'Recebo de tempos em tempos um perfil que se repete: executivo de 50 e poucos anos, check-up todo ano há uma
    década, exames sempre dentro da referência. Uma manhã, indo trabalhar, sente o aperto no peito. Cateterismo de urgência.
    Stent.


    Volta ao consultório três meses depois com uma pergunta: como? Eu fazia tudo certo.


    Refaço o painel: agora com ApoB, Lp(a), insulina basal, PCR ultrassensível, homocisteína e escore de cálcio coronariano.
    Nenhum desses estava no check-up dele. Todos vinham sinalizando desfecho há quase uma década.


    Quatro doenças dominam a mortalidade adulta depois dos 40: cardiovascular, metabólica, neurodegenerativa e câncer. As
    quatro têm fase silenciosa de 10 a 20 anos antes do primeiro sintoma. As quatro compartilham o mesmo terreno: resistência
    insulínica, inflamação crônica de baixo grau, disfunção metabólica.


    Não são doenças independentes. São quatro manifestações do mesmo processo, vistas por janelas diferentes.


    O PESA, conduzido pelo grupo do Valentín Fuster (JACC 2021), acompanhou 4.184 adultos espanhóis assintomáticos entre 40
    e 55 anos. Aterosclerose subclínica em 63% deles (71% dos homens, 48% das mulheres). Em 41%, doença intermediária ou generalizada.
    Pessoas que se consideravam saudáveis, com colesterol "normal", enquanto as placas cresciam.


    Outro ponto que o painel convencional não captura: as artérias remodelam pra acomodar a placa. O lúmen quase não muda.
    O teste ergométrico vem normal. Até a placa inflamada (não necessariamente a maior) se romper.


    Placas com menos de 50% de obstrução podem matar. Placas com 90% podem nunca se romper. O check-up convencional procura
    obstrução. A doença é inflamação.


    A janela pra agir existe e é longa: abre nos 40 e começa a fechar aos 65, com folga variável.


    No consultório, leio essas quatro frentes em painel único. É a única forma que encontrei de não perder o conjunto.


    O que distingue quem chega aos 80 bem de quem chega arrastado, na minha experiência, não é a doença que aparece. É o silêncio
    que antecedeu.

    '
