- slug: ferritina-30-a-100-normalidade-que-esgota-mulheres
  block: 2
  order: 12
  status: published
  scheduled_at: '2026-06-04 08:26:00-03:00'
  commentary: 'Mulher de 38 anos, dois filhos, ciclo menstrual regular e abundante. Cansaço que o café não resolve há dois
    anos. Cabelo caindo no banho. Falta de ar subindo dois lances de escada. Treino que rendia 7 km, agora 4 e parece o triplo.


    Hemoglobina 13,1 g/dL: normal. Ferritina 38 ng/mL: o laudo carimbou "valor de referência 13 a 150". "Tudo normal."


    Não estava.


    O carimbo "normal" da ferritina entre 13 e 150 ng/mL foi calibrado pra flagrar anemia ferropriva, a fase em que o corpo
    já consumiu as reservas e a hemoglobina começou a cair. Não foi calibrado pra flagrar deficiência funcional de ferro:
    a fase anterior, em que ainda há hemoglobina, mas as reservas estão vazias.


    E o ferro é cofator de enzimas mitocondriais que produzem energia, da síntese de dopamina e serotonina, do crescimento
    do cabelo, da contratilidade muscular. Quando a ferritina cai com hemoglobina ainda normal, esses processos operam em
    modo de economia.


    Três ensaios randomizados convergiram. Verdon (BMJ 2003), Krayenbuehl (Blood 2011), Vaucher (CMAJ 2012): mulheres com
    fadiga, hemoglobina normal e ferritina abaixo de 50 melhoraram significativamente com reposição de ferro. A revisão Pasricha
    no Lancet 2021 fechou: deficiência de ferro sem anemia é entidade clínica real, prevalente, sub-diagnosticada. A fadiga
    aparece antes da queda de hemoglobina. O hemograma é o último marcador a sinalizar.


    A leitura clínica que uso para mulher menstruante: ferritina abaixo de 30 é deficiência. 30 a 50 com sintomas é alta probabilidade
    de deficiência funcional. 50 a 100 é zona cinzenta, em que a saturação de transferrina abaixo de 20% confirma. Alvo terapêutico:
    ferritina entre 80 e 100.


    Cansaço sem fim em uma mulher de 38 anos não é maternidade. Não é rotina. É, com frequência muito maior do que se admite,
    sintoma operável escondido atrás da palavra "normal" carimbada num laudo.


    Cansaço crônico em mulher menstruante adulta exige checar ferritina junto com saturação de transferrina e, se necessário,
    repor ferro pra alvo terapêutico (80-100 ng/mL), e não esperar a anemia franca aparecer no hemograma pra agir.

    '
