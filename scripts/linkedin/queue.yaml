  commentary: 'Atendo recorrentemente paciente que chega com sacola de farmácia e a pergunta certa: gasto fortuna por mês,
    está fazendo alguma coisa?


    A literatura de suplementação em adultos acima dos 40 é vasta. Quando se filtra por ensaios randomizados de tamanho razoável,
    com desfechos clinicamente relevantes, o núcleo do que sobra é curto: creatina monoidratada, ômega-3 (EPA+DHA, ou EPA
    isolado em dose alta para indicações específicas), vitamina D em deficientes (em conjunto com vitamina K2), magnésio em
    deficientes ou em condições específicas.


    Creatina monoidratada. Foi estigmatizada por décadas como "coisa de academia" e está sendo redescoberta na clínica de
    longevidade pelo motivo certo. A meta-análise de Chilibeck (Open Access J Sports Med 2017) agregou 22 ensaios em adultos
    de 57 a 70 anos: creatina + treino de força ganhou em média 1,37 kg de massa magra a mais que placebo + treino. Dose:
    3 a 5 g/dia, sem fase de carga, sem ciclos. Como nefrologista, afirmo com tranquilidade que a história do "creatina faz
    mal pro rim" não se sustenta nos dados, em pessoas com função renal normal.


    Ômega-3. O VITAL (Manson, NEJM 2019) randomizou mais de 25 mil adultos pra 1 g/dia de óleo de peixe vs placebo: sem redução
    do desfecho cardiovascular primário em população geral. Mas o REDUCE-IT (Bhatt, NEJM 2019), com EPA puro 4 g/dia em pacientes
    com triglicérides elevados em estatina, reduziu 25% em eventos cardiovasculares maiores. A dose, a pureza e a indicação
    importam.


    Ponto de partida prático: anamnese alimentar. Quem come peixe gordo (sardinha, salmão, atum, cavala) duas a três vezes
    por semana costuma atingir ingesta adequada e não precisa suplementar. Pros demais, EPA+DHA combinados em torno de 2 g/dia,
    em formulação certificada (selo IFOS ou equivalente). O Índice de Ômega-3 eritrocitário, quando disponível, individualiza
    alvo (acima de 8%).


    Vitamina D + K2 (par obrigatório). A vitamina D aumenta a absorção intestinal de cálcio; a K2 (forma MK-7) é o cofator
    que direciona esse cálcio pro lugar certo, ativando a osteocalcina (que liga o cálcio à matriz óssea) e a proteína matriz
    Gla nos vasos (que age no sentido oposto ao da calcificação vascular). Repor vitamina D sem K2 adequado é abrir a torneira
    do cálcio sem definir o destino. Knapen (Osteoporos Int 2013): 180 µg/dia de MK-7 por 3 anos reduziu significativamente
    a perda óssea em mulheres na pós-menopausa.


    A reposição de D faz sentido quando há deficiência confirmada (25-OH-vitamina D abaixo de 30 ng/mL). Alvo razoável: 40
    a 60 ng/mL. Dose: 1.000 a 4.000 UI/dia na maioria. Só seguir a 25-OH é incompleto: integro PTH (em queda com a reposição
    confirma que a dose chegou à faixa funcional), cálcio sérico e cálcio urinário 24h (segurança), função renal e fósforo.
    Reavalio a cada 3 a 6 meses. K2 (MK-7) prescrita junto, 90 a 180 µg/dia.


    Magnésio. DiNicolantonio (Open Heart 2018) sintetizou: consumo médio em populações ocidentais está abaixo da RDA (310-420
    mg/dia), magnésio sérico só cai depois que os estoques teciduais já estão depletados, e a deficiência associa-se a hipertensão,
    resistência insulínica, arritmias, enxaquecas e qualidade de sono pobre. Dose: 200 a 400 mg/dia de magnésio elementar,
    em formas absorvíveis (glicinato pra sono, citrato com cuidado pelo efeito laxativo, treonato com dados emergentes em
    cognição). Evito óxido.


    Outras substâncias entram em situações clínicas próprias dentro do mesmo raciocínio dirigido (colágeno em osteoartrite,
    NAC em contextos selecionados, coenzima Q10 em mialgia por estatina, fibras solúveis em LDL ou controle glicêmico, B12
    dirigida em vegetarianos ou usuários crônicos de metformina), sempre com indicação clínica clara e prazo de reavaliação.


    Pelo método AGIR (Atividade Física, Alimentação e Suplementação Inteligente · Gestão Clínica e Metabólica · Integração
    Mente-Corpo · Ritmo Circadiano e Repouso) que aplico no Continuum Plenya, a regra que sustenta esse núcleo é a mesma do
    resto do método: a indicação parte da avaliação clínica, a dose se titula por exame, e a reavaliação acontece em ciclo
    programado.'
